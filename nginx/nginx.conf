# Rate limiting: max 30 requests/second per IP, burst of 50
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name 188.166.155.92;

    # Media files served directly by Nginx (bypasses Django/Gunicorn)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Logo files served directly by Nginx
    location /logos/ {
        alias /app/logos/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # All other requests proxied to Gunicorn
    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
